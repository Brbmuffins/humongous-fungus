# Release: push a tag named <game branch>-v<version>, for example
# ticker-rush-v1.0.0 or hammygotchi-v1.0.0. This checks the version matches
# the game's package.json, runs the tests, builds that game into one
# self-contained HTML file, and opens a draft GitHub release with the notes
# from docs/releases/<tag>.md and the game attached. Look the draft over on
# GitHub and press Publish when it's ready.
#
# Phone builds aren't made here: run the game's android-* and ios-*
# workflows by hand (they sign and upload to Google Play and TestFlight).
name: Release

on:
  push:
    tags: ['*-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Work out the game and version from the tag
        id: game
        run: |
          tag="$GITHUB_REF_NAME"
          name="${tag%-v*}"
          version="${tag##*-v}"
          case "$name" in
            humongous-fungus) game=fungus; title="Humongous Fungus" ;;
            sporemonger) game=sporemonger; title="Sporemonger" ;;
            hammygotchi) game=hammygotchi; title="Hammygotchi" ;;
            last-muffin-standing) game=lastmuffin; title="Last Muffin Standing" ;;
            ticker-rush) game=tickerrush; title="Ticker Rush" ;;
            *) echo "::error::$tag doesn't name a game. Use <game branch>-v<version>, like ticker-rush-v1.0.0."; exit 1 ;;
          esac
          if [ ! -f "games/$game/package.json" ]; then echo "::error::games/$game isn't in the tagged commit. Tag a commit on the $name branch."; exit 1; fi
          have=$(node -p "require('./games/$game/package.json').version")
          if [ "$have" != "$version" ]; then echo "::error::games/$game/package.json is at $have but the tag says $version."; exit 1; fi
          notes="docs/releases/$tag.md"
          if [ ! -f "$notes" ]; then echo "::error::Write the release notes in $notes first."; exit 1; fi
          {
            echo "name=$name"
            echo "game=$game"
            echo "title=$title"
            echo "version=$version"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - name: Build the game
        env:
          GAME: ${{ steps.game.outputs.game }}
        run: |
          npx tsc --noEmit
          npx vite build
          node scripts/make-artifact.mjs "$GAME"
          cp "dist/$GAME/index.html" "$RUNNER_TEMP/${{ steps.game.outputs.name }}-${{ steps.game.outputs.version }}.html"
      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/${{ steps.game.outputs.name }}-${{ steps.game.outputs.version }}.html" \
            --draft --verify-tag \
            --title "${{ steps.game.outputs.title }} ${{ steps.game.outputs.version }}" \
            --notes-file "${{ steps.game.outputs.notes }}"
          echo "Draft release ready: ${{ steps.game.outputs.title }} ${{ steps.game.outputs.version }}. Publish it from the repo's Releases page." >> "$GITHUB_STEP_SUMMARY"
