name: iOS · Hammygotchi

# Builds the iPhone app on a Mac in the cloud and uploads it to TestFlight.
# Run it by hand: Actions tab → "iOS · Hammygotchi" → Run workflow.
# Needs four repository secrets (see docs/app-store-checklist.md):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID
# Untick "upload" to only check that the app compiles (no secrets needed).
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROJECT: games/hammygotchi/ios/App/App.xcodeproj
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the game
        run: GAME=hammygotchi npx vite build

      - name: Copy the game into the iOS project
        working-directory: games/hammygotchi
        run: npx cap sync ios

      - name: Xcode version
        run: xcodebuild -version

      - name: Write the App Store Connect key
        if: inputs.upload
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v (see docs/app-store-checklist.md)"; exit 1; fi
          done
          mkdir -p "$(dirname "$RUNNER_TEMP/keys/AuthKey.p8")"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        run: |
          if [ "${{ inputs.upload }}" = "true" ]; then
            SIGN=(-allowProvisioningUpdates
                  -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8"
                  -authenticationKeyID "$ASC_KEY_ID"
                  -authenticationKeyIssuerID "$ASC_ISSUER_ID"
                  DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
                  CODE_SIGN_STYLE=Automatic)
          else
            SIGN=(CODE_SIGNING_ALLOWED=NO)
          fi
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${SIGN[@]}"

      - name: Upload to TestFlight
        if: inputs.upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It shows up in App Store Connect → TestFlight after Apple processes it (usually 10–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/keys/AuthKey.p8"
