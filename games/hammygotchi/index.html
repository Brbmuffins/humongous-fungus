<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1026" />
    <title>Hammygotchi</title>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand">
          <h1 class="brand-name">Hammygotchi</h1>
          <p class="who"><span id="who">Hammy #1</span> · <span id="age">just born</span></p>
        </div>
        <div class="purse">
          <p class="coins" aria-label="Hammy coins"><span class="coin" aria-hidden="true">H</span><span id="coins">0</span></p>
        </div>
      </header>
      <section class="meters" aria-label="How Hammy is doing">
        <div class="meter" data-need="belly" role="meter" aria-label="Belly" aria-valuemin="0" aria-valuemax="100"><span class="meter-top"><span class="meter-name">Belly</span><span class="meter-word"></span></span><span class="bar"><span class="bar-fill"></span></span></div>
        <div class="meter" data-need="fresh" role="meter" aria-label="Fresh" aria-valuemin="0" aria-valuemax="100"><span class="meter-top"><span class="meter-name">Fresh</span><span class="meter-word"></span></span><span class="bar"><span class="bar-fill"></span></span></div>
        <div class="meter" data-need="mood" role="meter" aria-label="Mood" aria-valuemin="0" aria-valuemax="100"><span class="meter-top"><span class="meter-name">Mood</span><span class="meter-word"></span></span><span class="bar"><span class="bar-fill"></span></span></div>
        <div class="meter" data-need="health" role="meter" aria-label="Health" aria-valuemin="0" aria-valuemax="100"><span class="meter-top"><span class="meter-name">Health</span><span class="meter-word"></span></span><span class="bar"><span class="bar-fill"></span></span></div>
      </section>
      <section class="stage" aria-label="The containment unit">
        <canvas id="tank" tabindex="0" aria-label="Hammy's containment unit. With the hand, drag Hammy to throw him or drop him on the shower, toilet, bed, armchair or PC. Tap him to pet him, tap poop to scoop it, tap the fridge for a steak and drag it onto the oven. Pick other toys in the bar below. Press Space to pet him."></canvas>
        <p class="hint" id="hint">Drag Hammy around. Drop him in the shower.</p>
        <p class="toast" id="toast" role="status" hidden></p>
        <p class="today" id="today">Today: cube hammy</p>
      </section>
      <div class="toybar" id="toybar" role="toolbar" aria-label="Toys"></div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button type="button" id="tab-care" role="tab" data-tab="care" aria-controls="sheet"><span class="tab-icon" aria-hidden="true">🍕</span><span class="tab-label">Care<span class="badge" hidden></span></span></button>
        <button type="button" id="tab-phone" role="tab" data-tab="phone" aria-controls="sheet"><span class="tab-icon" aria-hidden="true">📱</span><span class="tab-label">Phone<span class="badge" hidden></span></span></button>
        <button type="button" id="tab-shop" role="tab" data-tab="shop" aria-controls="sheet"><span class="tab-icon" aria-hidden="true">🛒</span><span class="tab-label">Shop<span class="badge" hidden></span></span></button>
        <button type="button" id="tab-life" role="tab" data-tab="life" aria-controls="sheet"><span class="tab-icon" aria-hidden="true">🪦</span><span class="tab-label">Life<span class="badge" hidden></span></span></button>
      </nav>
      <section class="sheet" id="sheet" hidden>
        <div class="sheet-head">
          <h2 class="sheet-title" id="sheet-title">Care</h2>
          <button type="button" class="sheet-close" id="sheet-close" aria-label="Close">✕</button>
        </div>
        <main class="panel" id="panel" role="tabpanel"></main>
      </section>
    </div>
    <div class="modal" id="modal" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
